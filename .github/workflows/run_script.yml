name: Generate GR2Analyst Placefile

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURED_NODE20: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: "true"

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURED_NODE20: "true"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        env:
          ACTIONS_ALLOW_USE_UNSECURED_NODE20: "true"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Placefile Generation Script
        env:
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
          WEATHERXM_API_TOKEN: ${{ secrets.WEATHERXM_API_TOKEN }}
        run: |
          python cwop_generator.py

      - name: Commit and Push Updated Placefile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add placefiles/cwop_observations.txt
          git commit -m "Auto-update GR2 placefile [skip ci]" || echo "No changes to commit"
          git push
