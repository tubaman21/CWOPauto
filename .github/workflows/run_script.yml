name: Generate CWOP Placefile

on:
  schedule:
    # Standard 15-minute interval syntax
    - cron: '*/15 * * * *'
  # Triggers the script automatically anytime you push code
  push:
    branches:
      - main
  # Keeps the manual "Run workflow" button active
  workflow_dispatch:

# Prevents multiple jobs from running simultaneously and colliding on git push
concurrency:
  group: cwop-placefile-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so rebase can resolve cleanly if needed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Generator Script
        env:
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
        run: python cwop_generator.py

      - name: Commit and Push Updated Placefile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add placefiles/cwop_observations.txt
          
          # Only proceed to commit if changes were detected
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated CWOP update"
            
            # Retry loop: Attempts rebase and push up to 5 times with 5-second delays
            n=0
            until [ "$n" -ge 5 ]
            do
               git pull --rebase origin main && git push && break
               n=$((n+1))
               echo "Push failed, retrying in 5 seconds (Attempt $n/5)..."
               sleep 5
            done
            
            if [ "$n" -eq 5 ]; then
              echo "Failed to push changes after 5 attempts."
              exit 1
            fi
          else
            echo "No changes to commit."
          fi
