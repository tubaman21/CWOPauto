name: Generate CWOP Placefile

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs automatically every 15 minutes
  workflow_dispatch:        # Allows you to manually trigger a run anytime

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write       # Essential permission allowing the bot to save your text file

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Generator Script
        # Cleaned up: The SYNOPTIC_API_TOKEN environment block has been removed
        run: python cwop_generator.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add placefiles/cwop_observations.txt
          
          # Only commits if weather data actually changed, preventing empty run errors
          git diff-index --quiet HEAD || (git commit -m "Automated CWOP update: $(date -u)" && git push)
