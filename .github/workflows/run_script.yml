name: Generate CWOP Placefile

on:
  schedule:
    # Standard 15-minute interval syntax
    - cron: '*/15 * * * *'
  # Triggers the script automatically anytime you push code
  push:
    branches:
      - main
  # Keeps the manual "Run workflow" button active
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Generator Script
        env:
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
        run: python cwop_generator.py

      - name: Commit and Push Updated Placefile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add placefiles/cwop_observations.txt
          git diff-index --quiet HEAD || (git commit -m "Automated CWOP update" && git push)
