name: Generate GR2Analyst Placefile

on:
  # schedule:
  #   - cron: '*/15 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Debug WisDOT Stations
        env:
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
        run: |
          python -c '
          import os, requests
          token = os.environ.get("SYNOPTIC_API_TOKEN")
          url = "https://api.synopticdata.com/v2/stations/metadata"
          
          print("--- Checking RWIS-16-0048 ---")
          res1 = requests.get(url, params={"token": token, "stid": "RWIS-16-0048"}).json()
          print(res1)
          
          print("\n--- Scanning BBox for WisDOT / RWIS ---")
          res2 = requests.get(url, params={"token": token, "bbox": "-97.5,42.5,-86.5,50.5"}).json()
          stations = res2.get("STATION", [])
          matches = [s for s in stations if "WIS" in str(s.get("MNET_SHORTNAME","")).upper() or "RWIS" in str(s.get("STID","")).upper() or "WISCONSIN" in str(s.get("MNET_NAME","")).upper()]
          for m in matches[:30]:
              stid = m.get("STID")
              mnet_id = m.get("MNET_ID")
              short = m.get("MNET_SHORTNAME")
              name = m.get("MNET_NAME")
              print("STID: " + str(stid) + " | MNET_ID: " + str(mnet_id) + " | SHORT: " + str(short) + " | NAME: " + str(name))
          '

      - name: Execute Placefile Generation Script
        env:
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
        run: |
          python cwop_generator.py

      - name: Commit and Push Updated Placefile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add placefiles/cwop_observations.txt
          git commit -m "Auto-update GR2 placefile [skip ci]" || echo "No changes to commit"
          git push
