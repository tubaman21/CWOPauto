name: Generate CWOP Placefile

on:
  schedule:
    - cron: '*/15 * * * *'  # Adjusted to 15 minutes to stay perfectly safe from free-tier rate limits
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Generator Script
        env:
          # 🔐 This tells GitHub to pull your secret and inject it into the Python runtime
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
        run: python cwop_generator.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add placefiles/cwop_observations.txt
          git diff-index --quiet HEAD || (git commit -m "Automated CWOP update: $(date -u)" && git push)
