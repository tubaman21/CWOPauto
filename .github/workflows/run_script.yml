name: Generate GR2Analyst Placefile

#on:
  #schedule:
    # Restored to run every 15 minutes
    #- cron: '*/15 * * * *'
  push:
    branches:
      - main  # Triggers whenever you commit changes to the main branch
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Placefile Generation Script
        env:
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
        run: |
          python cwop_generator.py

      - name: Commit and Push Updated Placefile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add placefiles/cwop_observations.txt
          git commit -m "Auto-update GR2 placefile [skip ci]" || echo "No changes to commit"
          git push
