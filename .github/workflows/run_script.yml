name: Generate CWOP Placefile

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Generator Script
        run: python cwop_generator.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add placefiles/cwop_observations.txt
          git diff-index --quiet HEAD || (git commit -m "Automated MADIS update: $(date -u)" && git push)

      # 🛡️ KEEPALIVE GUARD: Automatically signs a dummy heartbeat commit every 20 days if the repo is quiet.
      # This prevents GitHub from disabling your 5-minute automated background cron schedule!
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
