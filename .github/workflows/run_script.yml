name: Generate GR2Analyst Placefile

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Search WI State Stations
        env:
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
        run: |
          python -c '
          import os, requests
          token = os.environ.get("SYNOPTIC_API_TOKEN")
          url = "https://api.synopticdata.com/v2/stations/metadata"
          
          print("--- Scanning all Wisconsin stations for DOT / 16-0048 matches ---")
          res = requests.get(url, params={"token": token, "state": "WI"}).json()
          stations = res.get("STATION", [])
          
          matches = []
          for s in stations:
              stid = str(s.get("STID", ""))
              mnet_id = str(s.get("MNET_ID", ""))
              name = str(s.get("NAME", ""))
              mnet_short = str(s.get("MNET_SHORTNAME", ""))
              
              if "0048" in stid or "160" in stid or "RWIS" in stid or "DOT" in mnet_short or "DOT" in name or mnet_id in ["67", "173", "196"]:
                  matches.append(s)
                  
          print("Found " + str(len(matches)) + " potential matches:")
          for m in matches[:40]:
              print("STID: " + str(m.get("STID")) + " | MNET_ID: " + str(m.get("MNET_ID")) + " | MNET_SHORT: " + str(m.get("MNET_SHORTNAME")) + " | NAME: " + str(m.get("NAME")))
          '

      - name: Execute Placefile Generation Script
        env:
          SYNOPTIC_API_TOKEN: ${{ secrets.SYNOPTIC_API_TOKEN }}
        run: |
          python cwop_generator.py

      - name: Commit and Push Updated Placefile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add placefiles/cwop_observations.txt
          git commit -m "Auto-update GR2 placefile [skip ci]" || echo "No changes to commit"
          git push
